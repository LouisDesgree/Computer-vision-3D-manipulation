services:
  cv3d:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: computer-vision-3d
    image: cv3d:latest
    
    # Sur Mac, les caméras ne sont pas accessibles via /dev/video0
    # On utilise le backend AVFoundation d'OpenCV qui accède directement à la caméra macOS
    # Pas besoin de devices pour la caméra sur Mac
    # devices:
    #   - /dev/video0:/dev/video0
    
    # Variables d'environnement pour l'affichage
    environment:
      - DISPLAY=host.docker.internal:0
      - QT_X11_NO_MITSHM=1
      - PYTHONUNBUFFERED=1
      - LIBGL_ALWAYS_INDIRECT=1
      - MESA_GL_VERSION_OVERRIDE=3.3
      - MESA_GLSL_VERSION_OVERRIDE=330
      - QT_QPA_FONTDIR=/usr/share/fonts
      - FONTCONFIG_PATH=/etc/fonts
    
    # Volumes
    volumes:
      - ./models:/app/models
      - ~/.cv3d:/root/.cv3d
    
    # Sur Mac, utiliser le backend AVFoundation avec auto-camera
    # Le backend AVFoundation accède directement à la caméra macOS sans /dev/video0
    # Note: Le script docker-entrypoint.sh ajoute déjà "python", donc on ne met que les arguments
    command: run_hand_cube.py --flip --backend avfoundation --auto-camera
    
    stdin_open: true
    tty: true
